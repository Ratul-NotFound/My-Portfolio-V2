<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Deep Space Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070e"/>
      <stop offset="50%" stop-color="#0a1022"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Holographic Energy Gradient -->
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#818cf8"/>
      <stop offset="80%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Cyan Laser Gradient -->
    <linearGradient id="cyanLaser" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Glass Rim Highlight -->
    <linearGradient id="rimLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Filter for Hyper-Glow -->
    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <radialGradient id="centerLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Squircle Container with Glass Edge -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" fill="none" stroke="url(#rimLight)" stroke-width="1.5" stroke-opacity="0.7"/>

  <!-- Ambient Glow Behind Monogram -->
  <circle cx="32" cy="32" r="22" fill="url(#centerLight)"/>

  <!-- Cyber Hexagonal Node / Circuit Lines Background (Subtle) -->
  <path d="M 32,8 L 52,19.5 L 52,44.5 L 32,56 L 12,44.5 L 12,19.5 Z" fill="none" stroke="#38bdf8" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="2 3"/>

  <!-- Creative Signature Geometric "R" + Terminal Prompt ">_" Glyph -->
  <g filter="url(#neonBlur)">
    <!-- Terminal Chevron ">" integrated into the R head -->
    <!-- Left Main Power Spine -->
    <line x1="19" y1="14" x2="19" y2="50" stroke="url(#cyanLaser)" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Top Arc of R (Curved Geometric Segment) -->
    <path d="M 19,14 L 33,14 C 43,14 44.5,28 33,29 L 19,29" fill="none" stroke="url(#neonGlow)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- High-Impact Diagonal Kick Leg with Laser Taper -->
    <path d="M 31,29 L 45,50" fill="none" stroke="url(#neonGlow)" stroke-width="5" stroke-linecap="round"/>

    <!-- Terminal Code Prompt Cursor Accent (_) -->
    <line x1="38" y1="50" x2="48" y2="50" stroke="#f43f5e" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Core Quantum Nodes -->
    <circle cx="19" cy="14" r="2.5" fill="#ffffff"/>
    <circle cx="33" cy="14" r="2" fill="#38bdf8"/>
    <circle cx="33" cy="29" r="2.5" fill="#818cf8"/>
    <circle cx="19" cy="29" r="2" fill="#38bdf8"/>
    <circle cx="45" cy="50" r="2.5" fill="#f43f5e"/>
    <circle cx="19" cy="50" r="2.5" fill="#38bdf8"/>
  </g>
</svg>
